<!DOCTYPE html>
<html>
<head>
	<title>chat thingy</title>

	<style>
		body {
			background:#eef2ff;
			font-family:"Times New Roman";
			margin:0;
		}

		#layout {
			display:flex;
			width:1000px;
			margin:20px auto;
			gap:10px;
		}

		#container {
			width:700px;
			background:white;
			border:1px solid #aaa;
			padding:10px;
			display:flex;
			flex-direction:column;
			height:80vh;
		}

		h1 {
			font-size:20px;
			margin:0 0 10px 0;
			color:#800000;
		}

		#messages {
			flex:1;
			overflow-y:auto;
			border:1px solid #ddd;
			padding:5px;
			margin-bottom:10px;
			list-style:none;
		}

		.msg {
			display:flex;
			gap:10px;
			padding:6px;
			border-bottom:1px solid #eee;
			align-items:flex-start;
		}

		.msg img {
			max-width:120px;
			max-height:120px;
			border:1px solid #aaa;
			cursor:pointer;
		}

		.msg-content { flex:1; }

		.name {
			color:#117743;
			font-weight:bold;
		}

		.msgid {
			color:#888;
			font-size:11px;
			margin-left:6px;
		}

		.reply-inline {
			display:block;
			margin-bottom:2px;
		}

		.reply-link {
			color:#800000;
			cursor:pointer;
		}

		form {
			display:flex;
			gap:5px;
		}

		input {
			padding:5px;
			border:1px solid #aaa;
		}

		#boards {
			display:flex;
			justify-content:center;
			gap:10px;
			margin-top:10px;
		}

		.boardBtn {
			padding:5px;
			border:1px solid #888;
			background:#eee;
			cursor:pointer;
		}

		.boardBtn.active {
			background:#ddd;
		}

		#threadsPanel {
			width:250px;
			background:white;
			border:1px solid #aaa;
			padding:10px;
			display:flex;
			flex-direction:column;
			height:80vh;
		}

		#threadList {
			flex:1;
			overflow-y:auto;
			border:1px solid #ddd;
		}

		.threadItem {
			padding:6px;
			border-bottom:1px solid #eee;
			cursor:pointer;
		}

		.reply-btn {
			font-size:12px;
			color:#555;
			cursor:pointer;
		}

		.zoomed-img {
			position: fixed;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			max-width: 90vw !important;
			max-height: 90vh !important;
			width: auto !important;
			height: auto !important;
			z-index: 9999;
			cursor: zoom-out;
		}

		.img-backdrop {
			position:fixed;
			inset:0;
			background:rgba(0,0,0,0.4);
			z-index:9998;
		}
		
				#helpBtn {
			position: fixed;
			top: 10px;
			left: 10px;
			width: 22px;
			height: 22px;
			background: #ddd;
			border: 1px solid #888;
			text-align: center;
			line-height: 22px;
			cursor: pointer;
			font-weight: bold;
			font-family: Arial;
		}

		#helpModal {
			position: fixed;
			inset: 0;
			background: rgba(0,0,0,0.5);
			display: flex;
			justify-content: center;
			align-items: center;
			z-index: 9999;
		}

		#helpBox {
			background: white;
			padding: 15px;
			border: 1px solid #aaa;
			width: 300px;
			font-family: "Times New Roman";
		}

		.hidden {
			display: none !important;
		}
	</style>
</head>

<body>

<div id="helpBtn">?</div>

<div id="helpModal" class="hidden">
	<div id="helpBox">
		<h3>message formatting help</h3>

		<p>
			you can color words using the formatting:
		</p>

		<pre>&lt;col:red&gt;red &lt;col:green&gt;green &lt;col:blue&gt;blue</pre>

		<p>
			each tag changes color until the next one. default color is black :3
		</p>

		<button id="closeHelp">close</button>
	</div>
</div>

<div id="layout">

<div id="container">
	<h1 id="title">/main/ :3</h1>

	<ul id="messages"></ul>

	<form id="form">
		<input id="input" placeholder="message..." autocomplete="off">
		<button>send</button>
	</form>

	<input type="file" id="imageFile" accept="image/*">
	<input id="username" placeholder="username">

	<div id="boards">
		<button class="boardBtn active" data-board="main">/main/</button>
		<button class="boardBtn" data-board="b">/b/</button>
		<button class="boardBtn" data-board="food">/food/</button>
		<button class="boardBtn" data-board="images">/images/</button>
	</div>
</div>

<div id="threadsPanel">
	<div id="threadList"></div>
	<button id="newThreadBtn">+ thread</button>
</div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

let userId = localStorage.getItem("userId") || Math.floor(Math.random()*999999);
localStorage.setItem("userId", userId);

let username = localStorage.getItem("username") || "u.n. owen";
let currentBoard = "main";
let replyTarget = null;

const messages = document.getElementById("messages");
const form = document.getElementById("form");
const input = document.getElementById("input");
const usernameInput = document.getElementById("username");
const title = document.getElementById("title");

usernameInput.value = username;

socket.emit("register", {
	userId,
	username,
	board: currentBoard
});

/* ---------- helpers ---------- */
function esc(str) {
	return String(str)
		.replaceAll("&", "&amp;")
		.replaceAll("<", "&lt;")
		.replaceAll(">", "&gt;")
		.replaceAll('"', "&quot;");
}

function formatTime(ts) {
	const d = new Date(ts);

	const hh = String(d.getHours()).padStart(2,"0");
	const mm = String(d.getMinutes()).padStart(2,"0");
	const ss = String(d.getSeconds()).padStart(2,"0");

	const dd = String(d.getDate()).padStart(2,"0");
	const mo = String(d.getMonth()+1).padStart(2,"0");
	const yy = String(d.getFullYear()).slice(-2);

	return `${hh}:${mm}:${ss} - ${dd}/${mo}/${yy}`;
}

/* ---------- username ---------- */
usernameInput.addEventListener("input", () => {
	username = usernameInput.value.trim() || "u.n. owen";

	localStorage.setItem("username", username);

	socket.emit("register", {
		userId,
		username,
		board: currentBoard
	});
});

/* ---------- boards ---------- */
document.querySelectorAll(".boardBtn").forEach(btn => {
	btn.onclick = () => {
		currentBoard = btn.dataset.board;

		title.innerText = `/${currentBoard}/ :3`;

		document.querySelectorAll(".boardBtn")
			.forEach(b => b.classList.remove("active"));

		btn.classList.add("active");

		socket.emit("switch board", currentBoard);
	};
});

/* ---------- threads ---------- */
document.getElementById("newThreadBtn").onclick = () => {
	let name = prompt("thread name (max 30 chars)");
	if (!name) return;

	socket.emit("create thread", name);
};

socket.on("threads update", (threads) => {
	const list = document.getElementById("threadList");
	list.innerHTML = "";

	threads.forEach(t => {
		const div = document.createElement("div");

		div.className = "threadItem";
		div.textContent = t.name;

		div.onclick = () => {
			currentBoard = t.id;
			title.innerText = t.name + " :3";

			document.querySelectorAll(".boardBtn")
				.forEach(b => b.classList.remove("active"));

			socket.emit("switch board", t.id);
		};

		list.appendChild(div);
	});
});

/* ---------- sending ---------- */
form.onsubmit = async (e) => {
	e.preventDefault();

	let text = input.value.trim();
	let image = null;

	const file = document.getElementById("imageFile").files[0];

	if (file) {
		const fd = new FormData();
		fd.append("image", file);

		const res = await fetch("/upload", {
			method:"POST",
			body: fd
		});

		const data = await res.json();

		if (data.path) {
			image = data.path;
		}
	}

	if (!text && !image) return;

	socket.emit("chat message", {
		text,
		image,
		replyTo: replyTarget
	});

	input.value = "";
	replyTarget = null;
	input.placeholder = "message...";
	document.getElementById("imageFile").value = "";
};

/* ---------- render ---------- */

function parseColors(text) {
	text = text
		.replaceAll("&", "&amp;")
		.replaceAll("<", "&lt;")
		.replaceAll(">", "&gt;");

	const regex = /&lt;col:([^&]+)&gt;/g;

	let result = "";
	let lastIndex = 0;
	let match;

	let currentColor = "black";

	while ((match = regex.exec(text)) !== null) {

		result += `<span style="color:${currentColor}">` +
			text.slice(lastIndex, match.index) +
		`</span>`;

		currentColor = match[1].trim();
		lastIndex = regex.lastIndex;
	}

	result += `<span style="color:${currentColor}">` +
		text.slice(lastIndex) +
	`</span>`;

	return result;
}

function render(msg) {
	const li = document.createElement("li");
	li.className = "msg";
	li.id = "msg-" + msg.msgId;

	li.innerHTML = `
		${msg.image ? `<img src="${msg.image}">` : ""}
		<div class="msg-content">
			<div>
				<span class="name">${esc(msg.name)}</span>
				<span class="msgid">no. ${msg.msgId}</span>
				<span class="msgid">${formatTime(msg.time)}</span>
			</div>

			<div>
				${msg.replyTo ? `<span class="reply-inline reply-link" data-jump="${msg.replyTo}">>>${msg.replyTo}</span>` : ""}
				${parseColors(msg.text)}
			</div>

			<div class="reply-btn">[reply]</div>
		</div>
	`;

	li.querySelector(".reply-btn").onclick = () => {
		replyTarget = msg.msgId;
		input.placeholder = "replying to >>" + msg.msgId;
		input.focus();
	};

	const jump = li.querySelector("[data-jump]");

	if (jump) {
		jump.onclick = () => {
			const target = document.getElementById("msg-" + msg.replyTo);

			if (target) {
				target.scrollIntoView({
					behavior:"smooth",
					block:"center"
				});

				target.style.background = "#fff7cc";

				setTimeout(() => {
					target.style.background = "";
				}, 1000);
			}
		};
	}

	messages.appendChild(li);
	messages.scrollTop = messages.scrollHeight;
}


/* ---------- socket receive ---------- */
socket.on("chat history", (history) => {
	messages.innerHTML = "";
	history.forEach(render);
});

socket.on("chat message", (data) => {
	if (data.board !== currentBoard) return;
	render(data.msg);
});

/* ---------- image zoom ---------- */
let zoomed = null;
let backdrop = null;

document.addEventListener("click", (e) => {
	if (e.target.tagName === "IMG" && e.target.closest(".msg")) {

		if (zoomed === e.target) {
			closeZoom();
			return;
		}

		closeZoom();

		backdrop = document.createElement("div");
		backdrop.className = "img-backdrop";
		document.body.appendChild(backdrop);

		zoomed = e.target;
		zoomed.classList.add("zoomed-img");

		backdrop.onclick = closeZoom;
		zoomed.onclick = closeZoom;
	}
});

function closeZoom() {
	if (zoomed) zoomed.classList.remove("zoomed-img");
	if (backdrop) backdrop.remove();

	zoomed = null;
	backdrop = null;
}

/* -------- help popup -------------- */

const helpBtn = document.getElementById("helpBtn");
const helpModal = document.getElementById("helpModal");
const closeHelp = document.getElementById("closeHelp");

helpBtn.onclick = () => {
	helpModal.classList.remove("hidden");
};

closeHelp.onclick = () => {
	helpModal.classList.add("hidden");
};

helpModal.onclick = (e) => {
	if (e.target === helpModal) {
		helpModal.classList.add("hidden");
	}
};

</script>

</body>
</html>
