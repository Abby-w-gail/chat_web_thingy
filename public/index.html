<!DOCTYPE html>
<html>
<head>
<title>chat thingy</title>

<style>
body {
	background:#eef2ff;
	font-family:"Times New Roman";
	margin:0;
}

#layout {
	display:flex;
	width:1000px;
	margin:20px auto;
	gap:10px;
}

/* left part */
#container {
	width:700px;
	background:white;
	border:1px solid #aaa;
	padding:10px;
	display:flex;
	flex-direction:column;
	height:80vh;
}

h1 {
	font-size:20px;
	margin:0 0 10px 0;
	color:#800000;
}

/* chat */
#messages {
	flex:1;
	overflow-y:auto;
	border:1px solid #ddd;
	padding:5px;
	margin-bottom:10px;
	list-style:none;
}

.msg {
	display:flex;
	gap:10px;
	padding:6px;
	border-bottom:1px solid #eee;
}

.msg img {
	max-width:120px;
	max-height:120px;
	border:1px solid #aaa;
	cursor:pointer;
}

.msg-content { flex:1; }

.name { color:#117743; font-weight:bold; }
.msgid { color:#888; font-size:11px; margin-left:6px; }

.reply-btn {
	font-size:12px;
	color:#555;
	cursor:pointer;
}

/* input area */
textarea {
	width:100%;
	min-height:50px;
	max-height:300px;
	resize:vertical;
	overflow:auto;
	font-family:"Times New Roman";
}

/* threads */
#threadsPanel {
	width:250px;
	background:white;
	border:1px solid #aaa;
	padding:10px;
	display:flex;
	flex-direction:column;
	height:80vh;
}

#threadList {
	flex:1;
	overflow-y:auto;
	border:1px solid #ddd;
}

.threadItem {
	padding:6px;
	border-bottom:1px solid #eee;
	cursor:pointer;
}

#newThreadBtn {
	margin-top:auto;
}

/* image zooming */
.zoomed-img {
	position:fixed;
	top:50%;
	left:50%;
	transform:scale(3) translate(-50%,-50%);
	max-width:90vw;
	max-height:90vh;
	z-index:9999;
}

.img-backdrop {
	position:fixed;
	inset:0;
	background:rgba(0,0,0,0.4);
	z-index:9998;
}

/* html writing */
.html-preview {
	background:#f8f8f8;
	border:1px solid #aaa;
	padding:6px;
}

#form {
	flex-shrink:0;
}

/* help ? button */
#helpBtn {
	position:fixed;
	top:10px;
	left:10px;
	width:22px;
	height:22px;
	background:#ddd;
	border:1px solid #888;
	text-align:center;
	cursor:pointer;
}

.hidden { display:none !important; }

#helpModal {
	position:fixed;
	inset:0;
	background:rgba(0,0,0,0.5);
	display:flex;
	justify-content:center;
	align-items:center;
}

#helpBox {
	background:white;
	padding:15px;
	border:1px solid #aaa;
}

#boards {
	display:flex;
	justify-content:center;
	gap:10px;
	margin-top:10px;
}

#boards button {
	border:1px solid #888;
	background:#eee;
	cursor:pointer;
	border-radius:0;

	padding:4px 6px;
}
</style>
</head>

<body>

<div id="helpBtn">?</div>

<div id="helpModal" class="hidden">
	<div id="helpBox">
		<p>by doing stuff like "&lt;col:red&gt;" text can be given colors</p>
		<p>by starting message with "&lt;html&gt;" the rest of message will be treated as raw html mode (some stuff may not work! really wip)</p>
		<button id="closeHelp">close</button>
	</div>
</div>

<div id="layout">

<div id="container">
	<h1 id="title">/main/</h1>

	<ul id="messages"></ul>

	<form id="form">
		<textarea id="input"></textarea>
		<button>send</button>
	</form>

	<input type="file" id="imageFile">
	<input id="username" placeholder="username">

	<div id="boards">
		<button data-board="main">/main/</button>
		<button data-board="b">/b/</button>
		<button data-board="food">/food/</button>
		<button data-board="images">/images/</button>
	</div>
</div>

<div id="threadsPanel">
	<div id="threadList"></div>
	<button id="newThreadBtn">+ thread</button>
</div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

let userId = localStorage.getItem("userId") || Math.floor(Math.random()*999999);
localStorage.setItem("userId", userId);

let username = localStorage.getItem("username") || "u.n. owen";
let currentBoard = "main";
let replyTarget = null;

const messages = document.getElementById("messages");
const input = document.getElementById("input");
const usernameInput = document.getElementById("username");

usernameInput.value = username;

socket.emit("register", { userId, username, board: currentBoard });

/* ---------- the ? help btn ---------- */
const helpBtn = document.getElementById("helpBtn");
const helpModal = document.getElementById("helpModal");
const closeHelp = document.getElementById("closeHelp");

helpBtn.onclick = () => helpModal.classList.remove("hidden");
closeHelp.onclick = () => helpModal.classList.add("hidden");

/* ---------- username input ---------- */
usernameInput.oninput = () => {
	username = usernameInput.value || "u.n. owen";
	localStorage.setItem("username", username);
	socket.emit("register", { userId, username, board: currentBoard });
};

/* ---------- boards ---------- */
document.querySelectorAll("[data-board]").forEach(btn => {
	btn.onclick = () => {
		currentBoard = btn.dataset.board;
		socket.emit("switch board", currentBoard);
	};
});

/* ---------- fakeass boards (threads) ---------- */
document.getElementById("newThreadBtn").onclick = () => {
	const name = prompt("thread name");
	if (name) socket.emit("create thread", name);
};

socket.on("threads update", threads => {
	const list = document.getElementById("threadList");
	list.innerHTML = "";

	threads.forEach(t => {
		const div = document.createElement("div");
		div.className = "threadItem";
		div.textContent = t.name;

		div.onclick = () => {
			currentBoard = t.id;
			socket.emit("switch board", t.id);
		};

		list.appendChild(div);
	});
});

/* ---------- color parsing ---------- */
function esc(s){
	return String(s)
	.replaceAll("&","&amp;")
	.replaceAll("<","&lt;")
	.replaceAll(">","&gt;");
}

function parseColors(text){
	text = esc(text);

	const regex = /&lt;col:([^&]+)&gt;/g;

	let result = "";
	let last = 0;
	let m;
	let color = "black";

	while((m = regex.exec(text))){
		result += `<span style="color:${color}">` +
			text.slice(last, m.index) +
		`</span>`;

		color = m[1];
		last = regex.lastIndex;
	}

	result += `<span style="color:${color}">` +
		text.slice(last) +
	`</span>`;

	return result;
}

/* ---------- image zooming ---------- */
let zoomed=null, backdrop=null;

document.addEventListener("click", e=>{
	if(e.target.tagName==="IMG" && e.target.closest(".msg")){
		if(zoomed===e.target){ close(); return; }

		close();

		backdrop=document.createElement("div");
		backdrop.className="img-backdrop";
		document.body.appendChild(backdrop);

		zoomed=e.target;
		zoomed.classList.add("zoomed-img");

		backdrop.onclick=close;
		zoomed.onclick=close;
	}
});

function close(){
	if(zoomed) zoomed.classList.remove("zoomed-img");
	if(backdrop) backdrop.remove();
	zoomed=null; backdrop=null;
}

/* ---------- rendering messages ---------- */
function render(msg){
	const li=document.createElement("li");
	li.className="msg";
	li.id="msg-"+msg.msgId;

	let body;

	if(msg.text.startsWith("<html>")){
	const html = document.createElement("div");
	html.className = "html-preview";
	html.innerHTML = msg.text.slice(6);

	body = html.outerHTML;
}else{
		body = parseColors(msg.text).replaceAll("\n","<br>");
	}

	li.innerHTML=`
		${msg.image ? `<img src="${msg.image}">` : ""}
		<div class="msg-content">

			<div>
				<span class="name">${msg.name}</span>
				<span class="msgid">#${msg.msgId} ${new Date(msg.time).toLocaleString()}</span>
			</div>

			<div>
				${msg.replyTo ? `<div class="reply-link">>>${msg.replyTo}</div>` : ""}
				${body}
			</div>

			<div class="reply-btn">[reply]</div>
		</div>
	`;

	const replyBtn = li.querySelector(".reply-btn");
	replyBtn.onclick = () => {
		replyTarget = msg.msgId;
		input.placeholder = "replying to >>"+msg.msgId;
	};

	const replyLink = li.querySelector(".reply-link");
	if(replyLink){
		replyLink.onclick = () => {
			const t=document.getElementById("msg-"+msg.replyTo);
			if(!t) return;
			t.scrollIntoView({behavior:"smooth",block:"center"});
			t.style.background="#fff7cc";
			setTimeout(()=>t.style.background="",1000);
		};
	}

	messages.appendChild(li);
	messages.scrollTop=messages.scrollHeight;
}

/* ---------- sending messages ---------- */
document.getElementById("form").onsubmit = async (e)=>{
	e.preventDefault();

	let text=input.value;
	let image=null;

	const file=document.getElementById("imageFile").files[0];

	if(file){
		image=await new Promise(res=>{
			const r=new FileReader();
			r.onload=()=>res(r.result);
			r.readAsDataURL(file);
		});
	}

	socket.emit("chat message",{
		text,
		image,
		replyTo:replyTarget
	});

	input.value="";
	input.placeholder = "message...";	
	replyTarget=null;
	document.getElementById("imageFile").value = "";
};

/* ---------- socket ---------- */
socket.on("chat history",h=>{
	messages.innerHTML="";
	h.forEach(render);
});

socket.on("chat message",d=>{
	if(d.board!==currentBoard) return;
	render(d.msg);
});
</script>

</body>
</html>
